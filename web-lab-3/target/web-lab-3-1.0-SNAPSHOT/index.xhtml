<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Welcome</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
</h:head>
<h:body>
    <h:outputScript>
        var points = JSON.parse('#{pointBean.pointsAsJson}');
        var rValue = #{pointBean.r};
    </h:outputScript>
    <script type="text/javascript">
        function drawGraph() {
            let R = rValue;
            const canvas = document.getElementById('Canv');
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            drawGrid(ctx, width, height);

            const centerX = width / 2;
            const centerY = height / 2;
            const scale = 50;

            createOxi(ctx, width, centerX, centerY, height);

            comments(ctx, scale, centerX, width, R);


            ctx.beginPath();
            ctx.fillStyle = createGradient(ctx, canvas, 'rgba(0, 0, 0, 0.2)');
            ctx.fillRect(centerX, centerY - scale * R, scale * R, scale * R);

            ctx.fillStyle = createGradient(ctx, canvas, 'rgba(0, 0, 0, 0.2)');
            ctx.moveTo(centerY, centerX);
            ctx.arc(centerY, centerX, scale * R, 0, 0.5 * Math.PI, false);
            ctx.lineTo(centerX, centerY);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = createGradient(ctx, canvas, 'rgba(0, 0, 0, 0.3)');
            ctx.moveTo(centerY, centerX);
            ctx.lineTo(centerY, centerX - scale * R);
            ctx.lineTo(centerY - scale * R/2, centerX);
            ctx.fill();
        }

        function createGradient(context, canvas, color) {
            const gradient = context.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, color);
            return gradient;
        }

        function createOxi(ctx, width, centerX, centerY, height){
            // X和Y轴
            ctx.beginPath();
            ctx.strokeStyle = "#000000";
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, height);
            // 箭头
            ctx.moveTo(width, centerY);
            ctx.lineTo(width - 10, centerY - 5);
            ctx.moveTo(width, centerY);
            ctx.lineTo(width - 10, centerY + 5);
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX - 5, 10);
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX + 5, 10);
            ctx.stroke();
        }

        function drawGrid(ctx, width, height){
            ctx.strokeStyle = "#808080";
            ctx.lineWidth = 0.5;

            const step = 50;
            for (let x = 0; x &lt; width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y &lt; height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function comments(ctx, scale, centerX, width, R){
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillStyle = "#000000";
            ctx.fillText("-R", centerX - scale * R, centerX + 10);
            ctx.fillText("-R/2", centerX - scale/2 * R , centerX + 10);
            ctx.fillText("R/2", centerX + scale/2 * R , centerX + 10);
            ctx.fillText("R", centerX + scale * R , centerX + 10);
            ctx.fillText("x", width - 5, centerX - 10);

            ctx.fillText("-R", centerX + 10, centerX + scale * R);
            ctx.fillText("-R/2", centerX + 10, centerX + scale/2 *R);
            ctx.fillText("R/2", centerX + 10, centerX - scale/2 *R);
            ctx.fillText("R", centerX + 10, centerX - scale * R);
            ctx.fillText("y", centerX + 10, 10);
        }

        function drawPoints(x, y) {
            const canvas = document.getElementById("Canv");
            const ctx = canvas.getContext("2d");
            const scale = 50;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            const pointX = centerX + x * scale;
            const pointY = centerY - y * scale;

            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(pointX, pointY, 3, 0, 2 * Math.PI);
            ctx.fill();
        }

        function validateY(input){
            let num= input;
            if (isNaN(num)) {
                alert("Please enter a valid number for Y coordinate.");
                console.warn("Invalid Y value:", num);
                return false;
            } else if (!/^-?\d+(\.\d+)?$/.test(num) || num &lt; -3 || num &gt; 3) {
                alert("Please enter a Y coordinate between -3 and 3.");
                console.warn("Invalid Y value:", num);
                return false;
            } else {
                return true;
            }
        }

        function validateNum(){
            let xValueHidden = document.getElementById('point-form:xHidden').value
            let yValue = document.getElementById('point-form:y').value
            let rValue = document.getElementById('point-form:r').value
            if (validateY(yValue)){
                if (xValueHidden &lt; 2 || xValueHidden &gt; -2) {
                    console.log(xValueHidden, yValue, rValue);
                    return true;
                }else{
                    return false;
                }
            }else{
                return false;
            }
        }


        function draw(){
            drawGraph()
            if (points != null) {
                points.forEach(point => {
                    drawPoints(point.x, point.y);
                });
            }
        }

        window.onload = function() {
            draw();
            document.getElementById("Canv").addEventListener("click", function(event){
                const rect = document.getElementById("Canv").getBoundingClientRect();
                const x = event.clientX - rect.left;
                const y = event.clientY - rect.top;

                let xCord = (x - 200) / 50;
                let yCord = (200 - y) / 50;

                document.getElementById('point-form:xHidden').value = xCord.toFixed(2);
                document.getElementById('point-form:y').value = yCord.toFixed(2);
                document.getElementById('point-form:r').value = rValue;

                if (validateNum()) {
                    drawPoints(xCord, yCord);
                    document.getElementById('point-form:HiddenButton').click();
                }
            });
        };
    </script>

    <div id="student-info" class="container">
        <h1>Чэнь Жохань P3222 413107</h1>
    </div>

    <div class="container">
        <div id="graph" class="card">
            <h:outputLabel><canvas id="Canv" width="400" height="400"/></h:outputLabel>
        </div>

        <div id="point" class="card">

            <h:form id="point-form">
                <h:outputLabel value="X: "/>
                <h:inputHidden id="xHidden" value="#{pointBean.XHidden}"/>
                <h:selectOneMenu id="xSelect" value="#{pointBean.x}">
                    <f:selectItem itemValue="-2" itemLabel="-2" />
                    <f:selectItem itemValue="-1.5" itemLabel="-1.5" />
                    <f:selectItem itemValue="-1" itemLabel="-1" />
                    <f:selectItem itemValue="-0.5" itemLabel="0.5" />
                    <f:selectItem itemValue="0" itemLabel="0" />
                    <f:selectItem itemValue="0.5" itemLabel="0.5" />
                    <f:selectItem itemValue="1" itemLabel="1" />
                    <f:selectItem itemValue="1.5" itemLabel="1.5" />
                    <f:selectItem itemValue="2" itemLabel="2" />
                    <f:ajax execute="@this" render="xHidden"/>
                </h:selectOneMenu>

                <h:outputLabel value="Y: " />
                <h:inputText id="y" value="#{pointBean.y}" onchange="validateY(this)"/>

                <h:outputLabel value="R: "/>
                <h:selectOneMenu value="#{pointBean.r}" id="r" onchange="draw()">
                    <f:ajax execute="@form" render="Canv"/>
                    <f:selectItem itemValue="1" itemLabel="1" />
                    <f:selectItem itemValue="2" itemLabel="2" />
                    <f:selectItem itemValue="3" itemLabel="3" />
                    <f:selectItem itemValue="4" itemLabel="4" />
                    <f:selectItem itemValue="5" itemLabel="5" />
                </h:selectOneMenu>

                <h:commandButton id="checkButton"
                                 value="check"
                                 action="#{pointBean.checkPoint}"/>
                <h:commandButton id="HiddenButton" action="#{pointBean.checkPoint2}" style="display: none;" />
                <h:commandButton id="clearButton"
                                 value="clear"
                                 action="#{pointBean.clearPoint}"/>
            </h:form>

            <div class="card">
                <h:dataTable id="resultTable" value="#{pointBean.points}" var="point">
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="x"/>
                        </f:facet>
                        <h:outputText value="#{point.x}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="y" />
                        </f:facet>
                        <h:outputText value="#{point.y}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="r"/>
                        </f:facet>
                        <h:outputText value="#{point.r}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="Result"/>
                        </f:facet>
                        <h:outputText value="#{point.check}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="CurTime"/>
                        </f:facet>
                        <h:outputText value="#{point.timeNow}"/>
                    </h:column>
                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="Execution time"/>
                        </f:facet>
                        <h:outputText value="#{point.executionTime}"/>
                    </h:column>
                </h:dataTable>
            </div>
            <div class="card" id="anniu">
                <h:link value="Start page" outcome="start"/>
            </div>
        </div>
    </div>
</h:body>
</html>
